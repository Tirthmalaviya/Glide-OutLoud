<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Glide Game · Grown-ups</title><link rel="stylesheet" href="css/style.css"></head><body class="clinic"><div class="clinic-layout">
<aside class="side no-print"><div class="brand"><div id="logo" style="width:42px"></div><div><b>Glide Game</b><span id="adultArea" class="small muted"></span></div></div><div class="label" id="playersLabel"></div><div id="playerList"></div><button class="btn-clinic ghost" id="addPlayer"></button><div class="privacy" id="privacy"></div><a href="index.html" id="backChild"></a></aside>
<main class="main"><header class="main-head"><div class="grow"><p class="small muted" id="activeLabel"></p><h1 id="title"></h1><p class="small muted" id="planSummary"></p></div><button class="btn-clinic ghost no-print" id="exportPdf"></button><button class="btn-clinic primary no-print" id="startSession"></button></header>
<nav class="clinic-tabs no-print" aria-label="Adult area"><button id="tab-results" data-tab="results" aria-pressed="true"></button><button id="tab-practice" data-tab="practice" aria-pressed="false"></button><button id="tab-backup" data-tab="backup" aria-pressed="false"></button></nav>
<section id="view-results"><div class="stats" id="stats"></div><p class="small metric-note" id="metricNote"></p><section class="panel" style="margin-top:16px"><h2 id="historyTitle"></h2><div class="row no-print" style="margin:12px 0"><label class="field"><span id="filterLabel"></span><select id="gameFilter"><option value="all"></option><option value="say"></option><option value="find"></option><option value="balloon"></option></select></label></div><div id="history" class="table-wrap"></div></section><section class="panel" style="margin-top:16px" id="sessionDetail" tabindex="-1"><h2 id="detailTitle"></h2><div id="detail"></div></section></section>
<section id="view-practice" hidden><form id="settingsForm" class="panel practice-form"><h2 id="settingsTitle"></h2><p class="small muted" id="personalNote"></p><div class="form-grid">
<label class="field"><span id="nameLabel"></span><input id="pName" type="text" maxlength="24" required></label><label class="field"><span id="ageLabel"></span><input id="pAge" type="number" min="3" max="10" required></label>
<label class="field"><span id="languageLabel"></span><select id="sLang"><option value="en">English</option><option value="fi">Suomi</option></select></label>
<label class="field"><span id="soundLabel"></span><select id="sSound"></select></label>
</div><p id="soundNote" class="small muted" aria-live="polite"></p><div class="form-grid" style="margin-top:16px">
<label class="field"><span id="holdLabel"></span><select id="sHold"><option value="auto"></option><option value="2">2 s</option><option value="3">3 s</option><option value="4">4 s</option><option value="6">6 s</option><option value="8">8 s</option></select></label>
<label class="field"><span id="roundsLabel"></span><select id="sRounds"><option>3</option><option>5</option><option>8</option></select></label>
<label class="field"><span id="questLabel"></span><select id="sQuest"><option value="auto"></option><option value="say"></option><option value="find"></option><option value="balloon"></option></select></label>
<label class="check"><span id="checkLabel"></span><input type="checkbox" id="sCheck"></label></div>
<p class="small metric-note" id="checkingNote"></p><div class="row form-actions"><button class="btn-clinic primary" id="saveBtn" type="submit"></button><span id="saveStatus" class="small" aria-live="polite"></span></div>
<details class="device-settings"><summary id="deviceLabel"></summary><p class="small muted" id="deviceNote"></p><button class="btn-clinic ghost" type="button" id="voiceSetup"></button><p id="voiceStatus" class="small muted" aria-live="polite"></p></details>
<details class="danger-settings"><summary id="manageLabel"></summary><p id="deleteNote" class="small muted"></p><button type="button" class="btn-clinic ghost" id="delBtn"></button></details></form></section>
<section id="view-backup" hidden><section class="panel"><h2 id="backupTitle"></h2><p id="backupNote" class="metric-note"></p><div class="row form-actions"><button class="btn-clinic primary" id="backupBtn"></button><button class="btn-clinic ghost" id="restoreBtn"></button></div><input type="file" id="backupFile" accept="application/json,.json" hidden><p id="backupStatus" class="small" aria-live="polite"></p><button class="btn-clinic ghost" id="undoRestore" style="margin-top:16px"></button></section><section class="panel" style="margin-top:16px"><h2 id="aboutTitle"></h2><p id="aboutText" class="metric-note"></p><p id="contentCount" class="small muted"></p><p class="small muted">Glide Game 1.0.1 · offline</p></section></section>
</main></div><dialog id="restoreDialog"><h2 id="restoreTitle"></h2><p id="restoreSummary"></p><p id="restoreWarning" class="metric-note"></p><div class="dialog-actions"><button class="btn btn-ghost" id="cancelRestore"></button><button class="btn btn-primary" id="confirmRestore"></button></div></dialog>
<script src="js/native.js"></script><script src="js/app.js"></script><script src="js/content.js"></script><script src="js/practice.js"></script><script src="js/api.js"></script><script src="js/therapist.js"></script></body></html>
