<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Glide Game: grown-ups</title><link rel="stylesheet" href="css/style.css"></head><body><main class="screen"><a class="pill" href="index.html" data-i18n="back"></a><section class="card"><h1 id="heading"></h1><p id="question" style="margin:20px 0"></p><form id="gate"><label class="field"><span id="label"></span><input id="answer" type="number" inputmode="numeric" required autocomplete="off"></label><button class="btn btn-primary" id="enter" type="submit"></button><p id="error" role="status" style="margin-top:16px"></p></form></section></main><script src="js/native.js"></script><script src="js/app.js"></script>
<script src="js/content.js"></script>
<script src="js/practice.js"></script><script>
GG.paint();const fi=GG.data.lang==='fi',a=6+Math.floor(Math.random()*7),b=4+Math.floor(Math.random()*6);
document.getElementById('heading').textContent=fi?'Aikuiselle':'For grown-ups';document.getElementById('question').textContent=`${a} + ${b} = ?`;document.getElementById('label').textContent=fi?'Vastaus':'Answer';document.getElementById('enter').textContent=fi?'Jatka':'Continue';document.getElementById('gate').onsubmit=e=>{e.preventDefault();if(Number(document.getElementById('answer').value)===a+b){sessionStorage.setItem('gg-adult','yes');location.href='therapist.html';}else document.getElementById('error').textContent=fi?'Yritä uudelleen.':'Please try again.';};
</script></body></html>
